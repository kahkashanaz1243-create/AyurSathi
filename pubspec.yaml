
name: ayur_sathi
description: AyurSathi offline bilingual Ayurveda and wellness app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  pdf: ^3.11.3
  printing: ^5.14.2
  google_mobile_ads: ^5.3.1
  flutter_local_notifications: ^19.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  archive: ^4.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/ayursathi_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/ayursathi_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/ayursathi_logo.png"
