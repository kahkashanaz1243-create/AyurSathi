
name: Build AyurSathi APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Verify Flutter source files
        shell: bash
        run: |
          set -euo pipefail
          test -f pubspec.yaml || {
            echo "ERROR: pubspec.yaml missing"
            exit 1
          }
          test -f lib/main.dart || {
            echo "ERROR: lib/main.dart missing"
            exit 1
          }
          test -f lib/app.dart || {
            echo "ERROR: lib/app.dart missing"
            exit 1
          }

          echo "Flutter source files found."
          find lib -maxdepth 4 -type f -print

      - name: Generate Android platform files
        run: flutter create --platforms=android .

      - name: Configure Android desugaring
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]

          path = next((p for p in candidates if p.exists()), None)

          if path is None:
              raise SystemExit("Android app Gradle file not found")

          text = path.read_text()
          is_kts = path.name.endswith(".kts")

          if is_kts:
              flag = "isCoreLibraryDesugaringEnabled"
              flag_line = "isCoreLibraryDesugaringEnabled = true"
              dependency = (
                  'coreLibraryDesugaring('
                  '"com.android.tools:desugar_jdk_libs:2.1.4")'
              )
          else:
              flag = "coreLibraryDesugaringEnabled"
              flag_line = "coreLibraryDesugaringEnabled true"
              dependency = (
                  "coreLibraryDesugaring "
                  "'com.android.tools:desugar_jdk_libs:2.1.4'"
              )

          if flag not in text:
              text, count = re.subn(
                  r"compileOptions\s*\{",
                  lambda m: m.group(0) + "\n        " + flag_line,
                  text,
                  count=1,
              )
              if count == 0:
                  raise SystemExit("compileOptions block not found")

          if "desugar_jdk_libs" not in text:
              match = re.search(
                  r"(?m)^\s*dependencies\s*\{",
                  text,
              )
              if match:
                  text = (
                      text[:match.end()]
                      + "\n    "
                      + dependency
                      + text[match.end():]
                  )
              else:
                  text += (
                      "\n\ndependencies {\n    "
                      + dependency
                      + "\n}\n"
                  )

          path.write_text(text)
          print("Desugaring configured:", path)
          PY


      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Fix Google Mobile Ads Gradle compatibility
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_GRADLE="$(
            find "$HOME/.pub-cache" \
              -path '*/google_mobile_ads-5.3.1/android/build.gradle' \
              -print -quit
          )"

          if [ -z "$PLUGIN_GRADLE" ]; then
            echo "Google Mobile Ads 5.3.1 Gradle file not found."
            exit 1
          fi

          python3 - "$PLUGIN_GRADLE" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          # Convert the nested legacy form:
          # configurations { all { ... } }
          # into the direct form:
          # configurations.all { ... }
          pattern = re.compile(
              r"\bconfigurations\s*\{\s*all\s*\{"
          )
          match = pattern.search(text)

          def matching_brace(source, opening):
              depth = 0
              for i in range(opening, len(source)):
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return i
              raise SystemExit("Unbalanced Gradle braces")

          if match:
              outer_open = text.find("{", match.start())
              inner_open = text.find("{", outer_open + 1)
              inner_close = matching_brace(text, inner_open)
              outer_close = matching_brace(text, outer_open)

              body = text[inner_open + 1:inner_close]
              replacement = "configurations.all {" + body + "}"

              text = (
                  text[:match.start()]
                  + replacement
                  + text[outer_close + 1:]
              )

          path.write_text(text)

          print("Patched plugin:", path)
          for number, line in enumerate(text.splitlines(), 1):
              if 45 <= number <= 72:
                  print(f"{number}: {line}")
          PY

      - name: Add Google test AdMob application ID
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q \
            "com.google.android.gms.ads.APPLICATION_ID" \
            "$MANIFEST"; then

            python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )
          text = path.read_text()

          start = text.find("<application")
          if start < 0:
              raise SystemExit("application tag not found")

          end = text.find(">", start)
          if end < 0:
              raise SystemExit("application tag end not found")

          metadata = (
              '\n        <meta-data\n'
              '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
              '            android:value="ca-app-pub-3580956288241135~2524153105" />'
          )

          text = text[:end + 1] + metadata + text[end + 1:]
          path.write_text(text)

          print("Test AdMob application ID added.")
          PY
          else
            echo "AdMob application ID already exists."
          fi

      - name: Analyze Dart code
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
  run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyurSathi-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
